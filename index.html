<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>로봇 상자 공장</title>
  <meta name="description" content="5학년 2학기 5단원 직육면체를 상자 공장 일로 익히는 게임">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
  <link rel="icon" href="data:,">
  <script>
    // 게임 버전: 고칠 때마다 여기 하나만 +0.001 (화면 아래 제작자 줄에도 이 값이 나온다)
    window.BUILD = 'v1.009';
    // 모든 파일 주소에 버전을 붙여, 패드에 예전 파일이 남아 있어도 새 버전 파일을 함께 받게 한다
    (function () {
      var q = '?v=' + window.BUILD;
      var map = { imports: { three: './vendor/three.module.js', 'three/addons/': './vendor/addons/' } };
      ['main', 'data', 'net', 'cutter', 'factory', 'three-view'].forEach(function (f) {
        map.imports[new URL('js/' + f + '.js', location.href).href] = './js/' + f + '.js' + q;
      });
      var im = document.createElement('script');
      im.type = 'importmap';
      im.textContent = JSON.stringify(map);
      document.head.appendChild(im);
      var css = document.createElement('link');
      css.rel = 'stylesheet';
      css.href = 'css/style.css' + q;
      document.head.appendChild(css);
      window.addEventListener('DOMContentLoaded', function () {
        var s = document.createElement('script');
        s.type = 'module';
        s.src = 'js/main.js' + q;
        document.body.appendChild(s);
      });
    })();
  </script>
</head>
<body>
  <div id="app"></div>
</body>
</html>
